<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <title>
      Turning a service into a product enterprises actually use — Aditya Sharma

    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var system = window.matchMedia("(prefers-color-scheme: dark)");
        var theme = stored || (system.matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient-base"></div>
      <div class="ambient-orb ambient-orb--a"></div>
      <div class="ambient-orb ambient-orb--b"></div>
      <div class="ambient-orb ambient-orb--c"></div>
      <div class="ambient-orb ambient-orb--d"></div>
      <div class="ambient-noise"></div>
    </div>

    <article class="page article">
      <header class="article-top">
        <a class="article-back" href="/#work">← Selected Work</a>
        <button id="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="icon-light">☀</span>
          <span class="icon-dark">☾</span>
        </button>
      </header>

      <p class="article-kicker">Selected Work · VIDA</p>
      <h1>Turning a service into a product enterprises actually use</h1>
      <p class="article-dek">
        Redesigned VIDA into a self-serve platform. 800 of 1,100 invited
        enterprises now use it.
      </p>

      <div class="article-body">
        <p>Full write-up coming soon.</p>
      </div>

      <footer class="article-footer">
        <a href="/#work">← Back to selected work</a>
        <a href="mailto:icaditya@hotmail.com">Email</a>
      </footer>
    </article>

    <script type="module" src="/src/page.js"></script>
  </body>
</html>
